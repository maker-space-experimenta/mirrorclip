---
# 1. THE DEPLOYMENT (Runs the NGINX container)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirrorclip
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mirrorclip
  template:
    metadata:
      labels:
        app: mirrorclip
    spec:
      containers:
      - name: web
        image: registry.default.svc.cluster.local:5000/mirrorclip:latest
        imagePullPolicy: Always # CRITICAL: Ensures it pulls new versions on restart
        ports:
        - containerPort: 80

---
# 2. THE SERVICE (Internal networking)
apiVersion: v1
kind: Service
metadata:
  name: mirrorclip-svc
  namespace: default
spec:
  selector:
    app: mirrorclip
  ports:
    - port: 80
      targetPort: 80

---
# 3. THE INGRESS (Routing traffic from the internet)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mirrorclip-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
  - hosts:
    - mirrorclip.hmnd.de
    secretName: mirrorclip-tls
  rules:
  - host: mirrorclip.hmnd.de
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mirrorclip-svc
            port:
              number: 80

---
# 4. THE CERTIFICATE (Forces Let's Encrypt to get SSL)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mirrorclip-tls
  namespace: default
spec:
  secretName: mirrorclip-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - mirrorclip.hmnd.de
