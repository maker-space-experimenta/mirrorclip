<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Clippy</title>
    <style>
        /* Basic reset and dark background */
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #222; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        /* Fullscreen webcam container */
        #video-container { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1;
            overflow: hidden;
        }
        
        /* 'object-fit: contain' shows the full camera feed without cropping */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            transform: scaleX(-1); /* Mirrors the image naturally */
        }
        
        /* Clippy's positioning */
        #clippy-container {
            position: absolute;
            bottom: 5vh;
            right: 5vw;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
        }
        
        /* Classic yellow speech bubble */
        #speech-bubble {
            background: #FFFFCC;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            width: 320px;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            display: none;
            position: relative;
            font-size: 24px;
            font-weight: 500;
            line-height: 1.4;
            color: #000;
        }
        
        /* The tail of the speech bubble */
        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            right: 40px;
            border-width: 12px 12px 0 0;
            border-style: solid;
            border-color: #FFFFCC transparent transparent transparent;
        }
        #speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -15px;
            right: 38px;
            border-width: 14px 14px 0 0;
            border-style: solid;
            border-color: #000 transparent transparent transparent;
            z-index: -1;
        }

        /* Local Clippy GIF styling */
        #clippy-img {
            min-height: 10vh; 
            height: 15vh; 
            width: auto;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
            animation: float 3s ease-in-out infinite;
            cursor: pointer;
            display: none; /* Hidden by default until the timer triggers him */
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>

<div id="video-container">
    <video id="webcam" autoplay playsinline></video>
</div>

<script>
    const video = document.getElementById('webcam');
    const bubble = document.getElementById('speech-bubble');
    const clippyImg = document.getElementById('clippy-img');
    let clippyTimer; // Variable to keep track of the active timeout

    // 1. Request access to the user's webcam with HIGH RESOLUTION constraints
    const cameraConstraints = {
        video: {
            width: { ideal: 4096}, // Requests 4K width
            height: { ideal: 2160  } // Requests 4K height
        }
    };

    navigator.mediaDevices.getUserMedia(cameraConstraints)
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            console.error("Error accessing webcam:", err);
            clippyImg.style.display = 'block';
            bubble.style.display = 'block';
            bubble.innerText = "Ich sehe, Sie haben den Kamerazugriff verweigert. Verstecken Sie Ihr Outfit vor mir?";
        });

    // 2. Simulated "AI" Fashion Comments in German
    const fashionComments = [
        "Es sieht so aus, als ob Sie Kleidung tragen! Benötigen Sie Hilfe beim Kombinieren?",
        "Mutige Wahl heute. Ich hätte eine andere Textur empfohlen.",
        "Ich sehe, Sie haben sich für den 'Home-Office'-Look entschieden. Sehr bequem!",
        "Fehler 404: Modegeschmack nicht gefunden. Nur ein Scherz!",
        "Dieses Outfit schreit förmlich 'Ich habe ungelesene E-Mails'.",
        "Ist das Vintage oder haben Sie nur vergessen, Wäsche zu waschen?",
        "Es sieht so aus, als würden Sie sich leger kleiden. Möchten Sie eine Krawatte dazu?",
        "Faszinierende Textilwahl. Fehlt nur noch etwas Metall, wenn Sie mich fragen.",
        "Mir ist aufgefallen, dass Sie Kleidung tragen. Möchten Sie ein neues Word-Dokument darüber erstellen?",
        "Es sieht so aus, als würden Sie heute verschiedene Muster mischen. Soll ich eine Warnmeldung ausgeben?",
        "Interessante Farbkombination. Haben Sie das im Dunkeln ausgewählt oder ist das Avantgarde?",
        "Ihre Kragenweite ist nicht rechtsbündig. Soll ich das für Sie formatieren?",
        "Ich habe Ihre Kleidung analysiert und beschlossen, dass wir noch einmal von vorne anfangen sollten. Neues Dokument öffnen?",
        "Ist diese Falte in Ihrem Hemd absichtlich oder ein Rendering-Fehler?",
        "Es sieht so aus, als ob Sie eine Hose tragen. Gut gemacht! Die meisten im Home-Office tun das nicht.",
        "Ihre Ärmel sind asymmetrisch hochgekrempelt. Soll ich das als neues Standard-Template speichern?",
        "Ich sehe, Sie tragen Schwarz. Versuchen Sie, sich als Terminal-Fenster zu tarnen?",
        "Ein mutiges Statement! Wenn dieses Outfit eine Schriftart wäre, wäre es definitiv Comic Sans.",
        "Ihre Accessoires sind anscheinend nicht abwärtskompatibel.",
        "Ich habe versucht, dieses Outfit in Excel zu importieren, aber es gab einen Syntaxfehler bei der Farbauswahl.",
        "Das ist... ein Look. Soll ich die Rückgängig-Funktion (Strg+Z) für diesen Pullover aktivieren?",
        "Ihre Kleidung hat zu wenig Kontrast. Soll ich den Dark-Mode für Sie aktivieren?",
        "Es sieht so aus, als ob Sie versuchen, stilvoll auszusehen. Leider ist mein Stil-Assistent gerade abgestürzt.",
        "Systemwarnung: Das Bügeleisen-Plug-in wurde heute Morgen offenbar nicht geladen.",
        "Warum?",
        "Mhh. Anhand ihres Äußeren kann ich wirklich nicht auf ihr Inneres schließen.",
        "Wie ich sehe setzen sie vor allem auf innere Werte. Das finde ich gut!"
    ];

    // 3. Logic to show Clippy
    function showClippy() {
        // Show the image
        clippyImg.style.display = 'block';
        
        // Pick a random comment and show the bubble
        const randomComment = fashionComments[Math.floor(Math.random() * fashionComments.length)];
        bubble.innerText = randomComment;
        bubble.style.display = 'block';
        
        // Stay for exactly 10 seconds, then call the hide function
        clearTimeout(clippyTimer);
        clippyTimer = setTimeout(hideClippy, 10000);
    }

    // 4. Logic to hide Clippy
    function hideClippy() {
        // Hide both the bubble and the image
        bubble.style.display = 'none';
        clippyImg.style.display = 'none';
        
        // Calculate a random time around 30 seconds (between 25,000ms and 35,000ms)
        const hiddenDuration = 25000 + Math.floor(Math.random() * 10000);
        
        // Schedule the next appearance
        setTimeout(showClippy, hiddenDuration);
    }

    // 5. Click Clippy to force a new comment immediately while he is visible
    clippyImg.addEventListener('click', () => {
        bubble.style.display = 'none';
        
        setTimeout(() => {
            const randomComment = fashionComments[Math.floor(Math.random() * fashionComments.length)];
            bubble.innerText = randomComment;
            bubble.style.display = 'block';
        }, 100);
        
        // Reset his 10-second timer so he doesn't disappear mid-sentence
        clearTimeout(clippyTimer);
        clippyTimer = setTimeout(hideClippy, 10000);
    });

    // 6. Initial start: Wait 5 seconds after the page loads before showing Clippy for the first time
    setTimeout(showClippy, 5000);

</script>
